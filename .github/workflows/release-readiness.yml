name: Release readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download authenticated published PDS Core 0.6.4 wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-dist"
          gh release download v0.6.4 --repo Paper-Data-Suite/pds-core --pattern "pds_core-0.6.4-py3-none-any.whl" --dir "$RUNNER_TEMP/core-dist"
          echo "48cea9317f2967bdc0f2d4c14349a56677c7c3f8211f0f33978ccb1a1c75859b  $RUNNER_TEMP/core-dist/pds_core-0.6.4-py3-none-any.whl" | sha256sum -c -
          python scripts/verify_core_wheel.py "$RUNNER_TEMP/core-dist/pds_core-0.6.4-py3-none-any.whl"
          python -m pip install "$RUNNER_TEMP/core-dist/pds_core-0.6.4-py3-none-any.whl"
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q scoreform
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy scoreform
      - name: Strict mypy release scripts
        run: |
          python -m mypy             --follow-imports=skip             --disallow-untyped-defs             --disallow-incomplete-defs             --check-untyped-defs             scripts/verify_release_compatibility.py             scripts/verify_installed_release.py             scripts/verify_installed_producer_acceptance.py             scripts/verify_installed_assignment_preset_acceptance.py             scripts/verify_installed_assignment_bulk_entry_acceptance.py             scripts/verify_installed_multi_class_generation_acceptance.py             scripts/verify_installed_task_oriented_assignment_menu_acceptance.py             scripts/verify_installed_recent_assignment_context_acceptance.py             scripts/verify_installed_guided_scan_to_results_acceptance.py             scripts/verify_installed_scan_quality_diagnostics_acceptance.py             scripts/verify_installed_share_results_with_meridian_acceptance.py             scripts/verify_installed_operations_acceptance.py             scripts/run_operations_wheel_acceptance.py             scripts/verify_release_artifacts.py
      - name: Strict mypy assignment-copy installed acceptance
        run: |
          python -m mypy \
            --follow-imports=skip \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            scripts/verify_installed_assignment_copy_acceptance.py
      - name: Strict mypy #195 combined acceptance
        run: |
          python -m mypy \
            --follow-imports=skip \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            scripts/verify_installed_v012_combined_acceptance.py scripts/verify_v012_physical_equivalence.py \
            scripts/run_v012_combined_wheel_acceptance.py
      - name: Pytest
        run: python -m pytest tests -q
      - name: Audit v0.12.0 release compatibility boundary
        run: python scripts/verify_release_compatibility.py
      - name: Build artifacts
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Inspect artifacts
        run: python scripts/verify_release_artifacts.py --version 0.12.0 --dist dist
      - name: Install wheel noneditable
        run: |
          python -m venv "$RUNNER_TEMP/scoreform-wheel"
          "$RUNNER_TEMP/scoreform-wheel/bin/python" -m pip install "$RUNNER_TEMP"/core-dist/pds_core-0.6.4-*.whl dist/scoreform-0.12.0-*.whl
          "$RUNNER_TEMP/scoreform-wheel/bin/python" -m pip check
      - name: Verify installed version and profile
        env:
          PDS_WORKSPACE_ROOT: ${{ runner.temp }}/scoreform-workspace-must-not-exist
        run: |
          test ! -e "$PDS_WORKSPACE_ROOT"
          "$RUNNER_TEMP/scoreform-wheel/bin/scoreform" --version | grep -Fx "ScoreForm 0.12.0"
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_release.py --version 0.12.0 --workspace "$PDS_WORKSPACE_ROOT" --expected-core-version 0.6.4
          "$RUNNER_TEMP/scoreform-wheel/bin/scoreform" --help >/dev/null
          "$RUNNER_TEMP/scoreform-wheel/bin/scoreform" version | grep -Fx "ScoreForm 0.12.0"
          test ! -e "$PDS_WORKSPACE_ROOT"
      - name: Verify installed module-operations attention
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_operations_acceptance.py             --workspace "$RUNNER_TEMP/scoreform-operations-acceptance"             --repository "$GITHUB_WORKSPACE"             --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed assignment copying
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_assignment_copy_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-copy-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed assignment presets
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_assignment_preset_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-preset-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed assignment bulk entry
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_assignment_bulk_entry_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-bulk-entry-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed multi-class generation
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_multi_class_generation_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-multi-class-generation-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed task-oriented Assignment Management
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_task_oriented_assignment_menu_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-task-oriented-assignment-menu-must-not-exist" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed recent/active assignment context
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_recent_assignment_context_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-context-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed guided scan-to-results
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_guided_scan_to_results_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-guided-scan-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed actionable scan-quality recovery
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_scan_quality_diagnostics_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-scan-quality-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed Share Results with Meridian
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_share_results_with_meridian_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-share-results-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify combined installed v0.12 workflow
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_v012_combined_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-v012-combined-acceptance" \
            --repository "$GITHUB_WORKSPACE" \
            --version 0.12.0 --expected-core-version 0.6.4
      - name: Verify installed producer lifecycle
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_producer_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-producer-acceptance" \
            --version 0.12.0 --expected-core-version 0.6.4

  results-analysis-wheel-qualification:
    name: Results Analysis installed-wheel qualification
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Qualify installed Results Analysis against released Core 0.6.4
        shell: pwsh
        run: |
          $coreWheel = Join-Path $env:RUNNER_TEMP "pds_core-0.6.4-py3-none-any.whl"
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.4/pds_core-0.6.4-py3-none-any.whl" `
            -OutFile $coreWheel
          $actual = (Get-FileHash -Algorithm SHA256 $coreWheel).Hash.ToLowerInvariant()
          $expected = "48cea9317f2967bdc0f2d4c14349a56677c7c3f8211f0f33978ccb1a1c75859b"
          if ($actual -ne $expected) {
            throw "Core v0.6.4 wheel SHA-256 mismatch: $actual"
          }
          $work = Join-Path $env:RUNNER_TEMP "scoreform-results-analysis-release"
          python scripts/run_results_analysis_wheel_acceptance.py `
            --repository . `
            --work $work `
            --core-wheel $coreWheel `
            --expected-core-version 0.6.4
