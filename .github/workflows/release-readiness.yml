name: Release readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download authenticated published PDS Core 0.6.3 wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-dist"
          gh release download v0.6.3 --repo Paper-Data-Suite/pds-core --pattern "pds_core-0.6.3-py3-none-any.whl" --dir "$RUNNER_TEMP/core-dist"
          echo "98d7596ce0eed26e4d56a17bbbbd644db3014259b56a45783a173fe8237af5e5  $RUNNER_TEMP/core-dist/pds_core-0.6.3-py3-none-any.whl" | sha256sum -c -
          python scripts/verify_core_wheel.py "$RUNNER_TEMP/core-dist/pds_core-0.6.3-py3-none-any.whl"
          python -m pip install "$RUNNER_TEMP/core-dist/pds_core-0.6.3-py3-none-any.whl"
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q scoreform
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy scoreform
      - name: Strict mypy release scripts
        run: |
          python -m mypy             --follow-imports=skip             --disallow-untyped-defs             --disallow-incomplete-defs             --check-untyped-defs             scripts/verify_release_compatibility.py             scripts/verify_installed_release.py             scripts/verify_installed_producer_acceptance.py             scripts/verify_installed_assignment_preset_acceptance.py             scripts/verify_installed_assignment_bulk_entry_acceptance.py             scripts/verify_installed_multi_class_generation_acceptance.py             scripts/verify_installed_task_oriented_assignment_menu_acceptance.py             scripts/verify_installed_recent_assignment_context_acceptance.py             scripts/verify_installed_guided_scan_to_results_acceptance.py             scripts/verify_installed_scan_quality_diagnostics_acceptance.py             scripts/verify_installed_share_results_with_meridian_acceptance.py             scripts/verify_release_artifacts.py
      - name: Strict mypy assignment-copy installed acceptance
        run: |
          python -m mypy \
            --follow-imports=skip \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            scripts/verify_installed_assignment_copy_acceptance.py
      - name: Pytest
        run: python -m pytest tests -q
      - name: Audit v0.10.0 release compatibility boundary
        run: python scripts/verify_release_compatibility.py
      - name: Build artifacts
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Inspect artifacts
        run: python scripts/verify_release_artifacts.py --version 0.10.0 --dist dist
      - name: Install wheel noneditable
        run: |
          python -m venv "$RUNNER_TEMP/scoreform-wheel"
          "$RUNNER_TEMP/scoreform-wheel/bin/python" -m pip install "$RUNNER_TEMP"/core-dist/pds_core-0.6.3-*.whl dist/scoreform-0.10.0-*.whl
          "$RUNNER_TEMP/scoreform-wheel/bin/python" -m pip check
      - name: Verify installed version and profile
        env:
          PDS_WORKSPACE_ROOT: ${{ runner.temp }}/scoreform-workspace-must-not-exist
        run: |
          test ! -e "$PDS_WORKSPACE_ROOT"
          "$RUNNER_TEMP/scoreform-wheel/bin/scoreform" --version | grep -Fx "ScoreForm 0.10.0"
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_release.py --version 0.10.0 --workspace "$PDS_WORKSPACE_ROOT" --expected-core-version 0.6.3
          "$RUNNER_TEMP/scoreform-wheel/bin/scoreform" --help >/dev/null
          "$RUNNER_TEMP/scoreform-wheel/bin/scoreform" version | grep -Fx "ScoreForm 0.10.0"
          test ! -e "$PDS_WORKSPACE_ROOT"
      - name: Verify installed assignment copying
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_assignment_copy_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-copy-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed assignment presets
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_assignment_preset_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-preset-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed assignment bulk entry
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_assignment_bulk_entry_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-bulk-entry-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed multi-class generation
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_multi_class_generation_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-multi-class-generation-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed task-oriented Assignment Management
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_task_oriented_assignment_menu_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-task-oriented-assignment-menu-must-not-exist" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed recent/active assignment context
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_recent_assignment_context_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-assignment-context-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed guided scan-to-results
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_guided_scan_to_results_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-guided-scan-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed actionable scan-quality recovery
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_scan_quality_diagnostics_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-scan-quality-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed Share Results with Meridian
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_share_results_with_meridian_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-share-results-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
      - name: Verify installed producer lifecycle
        run: |
          "$RUNNER_TEMP/scoreform-wheel/bin/python" scripts/verify_installed_producer_acceptance.py \
            --workspace "$RUNNER_TEMP/scoreform-producer-acceptance" \
            --version 0.10.0 --expected-core-version 0.6.3
