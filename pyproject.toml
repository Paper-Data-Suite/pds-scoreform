[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreform"
version = "0.8.1"
description = "A local-first classroom OMR tool for generating and scoring printable answer sheets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Stephen Severino" }
]
dependencies = [
  "opencv-python",
  "numpy",
  "pdf2image",
  "reportlab",
  "qrcode[pil]"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy"
]

[project.scripts]
scoreform = "scoreform.cli:main"

[tool.setuptools]
packages = ["scoreform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "local_outputs", "classes", "scans_inbox"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Existing long lines are deferred to avoid a broad formatting-only rewrite.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
